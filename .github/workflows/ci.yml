name: CI

# Same checks as `just lint` and `just test`, plus the `ruff check` and
# `ruff format --check` half of `just format` with the locked Ruff.
# Tests use config.settings.test (SQLite, no external services), so no
# secrets are needed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.13"

jobs:
  python:
    name: Lint and tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Lint (just lint)
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure
      - name: Ruff check (locked Ruff)
        run: uv run ruff check src tests
      - name: Ruff format check (locked Ruff)
        run: uv run ruff format --check src tests
      - name: Tests (just test)
        run: uv run pytest
